    <main id="app">
      <div id="loading">
        <button id="loading-language" type="button" aria-label="Switch to English">EN</button>
        <span>MINIATURE CITY ATLAS</span>
        <h1>真实深圳，微缩呈现。</h1>
        <div class="loading-line"></div>
        <p id="loading-detail">正在载入深圳的城市图层…</p>
      </div>
    </main>
    <script>(function initializeLoadingPage(detect) {
  let saved = null;
  try {
    saved = localStorage.getItem("shenzhen-language");
  } catch {
  }
  let language = detect(
    saved,
    navigator.languages?.length ? navigator.languages : [navigator.language]
  );
  const button = document.querySelector("#loading-language");
  const heading = document.querySelector("#loading h1");
  const detail = document.querySelector("#loading-detail");
  const render = () => {
    document.documentElement.lang = language === "zh" ? "zh-CN" : "en";
    document.title = language === "zh" ? "微缩城市图志 · 深圳 | Miniature City Atlas" : "Miniature City Atlas · Shenzhen";
    for (const [element, zh, en] of [
      [heading, "真实深圳，微缩呈现。", "Real Shenzhen, rendered in miniature."],
      [detail, "正在载入深圳的城市图层…", "Loading Shenzhen's city layers…"]
    ])
      if (element) {
        element.dataset.initialCopy = zh;
        element.textContent = language === "zh" ? zh : en;
      }
    if (button) {
      button.textContent = language === "zh" ? "EN" : "\u4E2D\u6587";
      button.setAttribute("aria-label", language === "zh" ? "Switch to English" : "\u5207\u6362\u4E3A\u4E2D\u6587");
    }
  };
  if (button)
    button.onclick = () => {
      language = language === "zh" ? "en" : "zh";
      try {
        localStorage.setItem("shenzhen-language", language);
      } catch {
      }
      render();
    };
  render();
})(function detectLanguage(saved, preferred) {
  if (saved === "zh" || saved === "en") return saved;
  for (const tag of preferred) {
    const primary = tag.toLowerCase().split(/[-_]/)[0];
    if (primary === "zh" || primary === "en") return primary;
  }
  return "en";
});</script>
